# Preregistration: Claim A, the blind phase boundary of planned_once_minus_greedy at the held-out setting delta 0.1
#
# One of two files that together make Claim A's test. This file licenses one test-tier
# launch: the held-out setting with delta doubled. Its twin,
# preregistrations/2026-11-27-claim-a-boundary-kappa-2.yaml, licenses the launch with kappa
# doubled. The decision rule is one test on the two reports together and is stated
# identically in both files; the verdict is computed once, after both reports exist, by
# `experiments/claim_a_gate.py score`. Neither file is amended after it is committed: a
# changed rule means a new dated file.
#
# This pair supersedes 2026-11-27-claim-a-boundary-kappa.yaml and -delta.yaml, committed
# earlier the same day, before any run at the held-out settings. Those files stay as the
# record; no launch is made under them, and their approval files are not used. What
# changed, from the adversarial review and the validator's dry run of 27 November: the
# run-1 gate they pinned could not pass (its comparison string did not allow for the
# comparator's note on the ignored argument); the gate now also checks run 1's provenance
# and the held-out reports' tier, completeness, finiteness and preregistration; "not
# completed" is mechanical; the sentences carry the 40-line scope and the achieved
# resolution; the simultaneity factor covers the 80 cells, not 40; the descriptive
# quantities have a pinned script. The decision rule, the null, the filter, the episode
# rule and n are unchanged.

slug: 2026-11-27-claim-a-boundary-delta-2
supersedes: 2026-11-27-claim-a-boundary-delta.yaml
written: 2026-11-27
claim: A
rung: planner-only; no learned agent is trained or evaluated

hypothesis: >
  On the 40 held-out (delay, lam) lines, 20 at kappa 0.2 and 20 at delta 0.1, the stage-2
  blind derivation places the resistance-noise level sigma at which the contrast
  planned_once_minus_greedy becomes positive for good closer to the measured crossing than
  the theory-free null does, where the null carries each dev line's measured crossing to
  the held-out settings unchanged: the 95% percentile bootstrap interval of E - E_null lies
  entirely below 0.

# ---------------------------------------------------------------- primary decision rule
primary_quantity: >
  D = E - E_null. E is the median over the 40 held-out lines of |log(sigma_hat / sigma_pred)|
  for the stage-2 predictions; E_null is the same median for the theory-free null; both are
  computed by experiments/score_phase_predictions.py on the same joint episode resamples,
  with measured and predicted crossings censored to [0.1, 0.4] as that script documents.
primary_test: the 95% percentile interval of D, the scorer's field E_minus_E_null_ci95
primary_margin: 0
resamples: 10000
seed: 0
verdict_pass: the upper bound of the interval is below 0
verdict_fail: the lower bound of the interval is at or above 0 (a tie with the null, lower bound exactly 0, is a fail)
verdict_inconclusive: the lower bound is below 0 and the upper bound is at or above 0
sentence_pass: >
  "On these 40 held-out lines, with episodes resampled and lines fixed, the blind theory's
  median log-ratio error in placing the sign change of planned_once_minus_greedy was below
  that of the theory-free null fitted on the 40-episode dev map: E - E_null 95% bootstrap
  interval [a, b], entirely below 0."
sentence_fail: >
  "On these 40 held-out lines the blind theory did not place the boundary better than
  carrying the dev map's crossings over: E - E_null 95% interval [a, b], lower bound at or
  above 0."
sentence_inconclusive: >
  "On these 40 held-out lines the test was inconclusive at n = 100 episodes per cell: E -
  E_null 95% interval [a, b] contains 0; the resolution on D was 0.707 SD* / Delta_min = r."
sentence_not_completed: >
  "The test did not complete." Stated, with no verdict, when `claim_a_gate.py score` prints
  NOT COMPLETED: a report missing, a report not of the test tier or not launched under the
  committed preregistration naming its setting, fewer than 480 results or 100 episodes, any
  non-finite report value, or a non-finite E, E_null or interval bound. A report written
  after 09:00 host time on 29 November counts as missing. The one exception is a line the
  predictions leave out, which makes E infinite and the verdict fail (severity below).
inference_scope: >
  The bootstrap resamples episodes, not lines, so every sentence holds for these 40 lines at
  these two settings and claims nothing about other lines or settings.
severity: >
  The null scored as if it were the theory gives D identically 0 on every resample, so the
  rule classes it as fail whatever the data. A theory that leaves out 20 or more of the 40
  lines has E infinite (score_phase_predictions.py gives an unpredicted line infinite error)
  and fails.

# ---------------------------------------------------------------- equivalence margin
equivalence_margin: >
  None on the primary rule: its margin is 0, and a null primary result is stated as "not
  better than the theory-free null", never as equivalence of theory and null. The scorer's
  margin log sqrt 2 = 0.34657 on E is kept for the secondary, descriptive clause "median
  error within the margin", which carries no verdict and is reported only beside E_null's
  own verdict against that margin (secondary_quantities).

# ---------------------------------------------------------------- episodes and power
episodes: 100
episode_rule: >
  n is the smallest count in [40, 100] with t_{0.975, n-1} SD* / sqrt(n) <= 0.005, where SD*
  is the largest sample standard deviation over the dev map's 80 cells of the per-episode
  contrast planned_once_minus_greedy (zero-spread cells cannot raise it), and 0.005 is half
  the margin m = 0.01 that arena/2026-11-24-design-outcome.md committed; if no count up to
  100 meets it, n is 100. Computed by experiments/claim_a_episode_count.py, which prints n
  and nothing else; the cap binds, so n = 100, and tau, borrowed from the learned-agent
  margin, has no effect on n. The floor of 40 keeps the test at least as
  precise as the map the null is built from; the cap comes from the ten-hour budget at
  twenty workers on the claim platform.
episode_seeds: >
  the first 100 evaluation episodes of the test tier of seeds.yaml, eval_seed(1000 + e) for
  e in 0..99, shared by every policy and every cell of both held-out reports; no training
  seed is used because no agent is trained.
detectable_effect: >
  At n = 100 the 95% half-width on a cell's mean contrast is 0.1984 SD (exact Student-t, 99
  degrees of freedom), where SD is that cell's paired SD; the cap binds, so this half-width
  is above tau = 0.005 at the dev map's largest cell SD*, and tau is not reached. By the
  delta method with correlation at most 1, a line's log crossing has half-width at most the
  cell half-width divided by Delta, the change of the mean contrast across the grid interval
  that brackets its crossing; E is 1-Lipschitz in the sup norm over the 40 lines' log
  crossings, and each bracket has two ends, so with the simultaneous Student-t factor 1.78
  over the 80 bracket cells (t at 1 - 0.025/80 over t at 0.975, 99 degrees of freedom) E
  resolves at most 0.353 SD* / Delta_min and D at most 0.707 SD* / Delta_min, under
  assumption A1. SD* is a dev-map spread and Delta_min a
  held-out mean; neither is read before the test, and both are reported with the result, so
  the resolution the test achieved is stated in log-ratio units beside the verdict. Under
  the assumptions below.
assumptions: >
  A1: no held-out cell's paired SD exceeds the dev map's SD* (the fraction of held-out cells
  with SD above SD*, a spread, is reported). A2: no grid cell other than the two ends of a
  crossing bracket has a mean within one half-width of 0. Both are stated as assumptions,
  not checked before the test.
rho_assumed: >
  Not a between-agent paired design: the pairing is of policies within a cell on shared
  episodes, and the bootstrap carries that dependence without assuming a correlation. The
  delta-method bound above takes correlation at most 1, the worst case.

# ---------------------------------------------------------------- instance grid
instance_grid: >
  One instance family at two held-out settings, each 80 cells: K = 4 drugs, M = 2
  mechanisms, class sizes [2, 2], imbalance KL = 0 nats; horizon 40 quarters; delays
  {0, 1, 2, 4, 8}; lams {0.0, 0.5, 0.8, 0.95}; sigmas {0.0, 0.1, 0.2, 0.4}. This file: kappa
  0.1, delta 0.1 (the dev map's delta doubled). Its twin: kappa 0.2, delta 0.05 (the dev
  map's kappa doubled). Both from experiments/claim_a_heldout_settings.json, fixed on
  2026-11-26 before the derivation started.
setting: 0.1/0.1
entropy_target_rule: not applicable; no entropy-regularised agent takes part (planner and heuristics only)
entropy_constant_c: not applicable

# ---------------------------------------------------------------- exclusions
floor_exclusion: none; no line, cell or episode is excluded
ceiling_exclusion: none
censoring: >
  Measured and predicted crossings are censored to [0.1, 0.4] by the scorer as it is: a line
  positive at every positive sigma crosses "below" (placed at 0.1), one not positive at the
  largest sigma crosses "above" (placed at 0.4), and two crossings censored on the same side
  agree. The counts of lines censored below, inside and above are reported for the measured,
  theory and null crossings, as is the number of lines whose error is 0 only because both
  sides are censored alike (21 or more of 40 makes the median 0 by construction, and that is
  then stated).
zero_contrast_lines: >
  A line whose contrast mean is exactly 0 at every sigma would give the null a line with no
  sign, which the scorer refuses. experiments/claim_a_episode_count.py refuses such a dev
  map; it accepted the pinned map. Held-out zero-width series are kept, scored as the scorer
  defines, and counted.
multiplicity: >
  One primary test on one scalar; no correction. The 40 per-line errors, the 160 cell
  intervals and any direction row are labelled "95% marginal, unadjusted, descriptive".
shared_episodes: >
  Every cell of both reports uses the same 100 test episodes. The bootstrap resamples
  episodes jointly, so the replication unit is 100 episodes, not 40 independent lines, and
  the paper says so in those words.

# ---------------------------------------------------------------- metrics
primary_metric: D = E - E_null with its 95% percentile interval and verdict_vs_null (score_phase_predictions.py)
secondary_quantities: >
  E, E_ci95 and the scorer's verdict against log sqrt 2 (worded only as "median error E = x,
  95% interval [lo, hi], against the margin log sqrt 2"); E_null and the null scored as if it
  were the theory (its own E and verdict against the margin: if the null also "passes" the
  margin, the margin sentence is stated to carry no predictive content); E per held-out
  setting, each from its own report and the null restricted to that setting; the censoring
  counts above; the 160 cell intervals (exact Student-t); the achieved held-out Delta_min and
  the fraction of cells with SD above SD*. Direction checks are not scored: the one
  direction the derivation predicts starts at the dev setting, which the test does not
  measure. Only the point values sigma_star and sign_at_max_sigma of the predictions file
  are scored; no line is excluded, reweighted or excused by any other column of the
  derivation's deliverable. The derivation's stage2.md assumed 20 evaluation episodes where
  the dev map used 40 and this test uses 100; that is disclosed wherever the result is cited.
  The censoring counts, the cell intervals, Delta_min and the spread-transfer share are
  computed by experiments/claim_a_descriptives.py from the scored files, after the verdict.
  If the primary verdict is fail or inconclusive, nothing secondary, per-setting or
  exploratory is worded as the theory against the null or as agreement with the derivation's
  predicted direction; such quantities are then described, not interpreted.

