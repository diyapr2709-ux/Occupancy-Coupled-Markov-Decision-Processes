# ---------------------------------------------------------------- platform and launches
platform: rtx-1
workers: at most 20, the count tools/rtx_guard.sh check admits just before each launch, recorded in decisions/
run_order: >
  1. Run 1, dev tier: the dev map rerun at this preregistration's commit, with the pinned
     map's arguments and `--workers W`:
     bash tools/rtx_guard.sh launch W -- .venv/Scripts/python experiments/sweep_phase_diagram.py
     --tier dev --platform rtx-1 --delays 0 1 2 4 8 --lams 0.0 0.5 0.8 0.95 --sigmas 0.0 0.1
     0.2 0.4 --class-sizes 2 2 --horizon 40 --episodes 40 --workers W --backend local --out
     runs/phase
  2. Gate: `.venv/Scripts/python experiments/claim_a_gate.py after-run1 runs/phase/<run 1
     report>.json --prereg preregistrations/2026-11-27-claim-a-boundary-delta-2.yaml` must
     print GATE PASS after eight PASS lines: this file committed and unmodified; the pinned
     map's hash; run 1 a dev-tier report from a clean commit whose tree holds this file byte
     for byte; run 1 not the pinned map; run 1 reproducing the pinned map bitwise under
     tools/compare_phase_reports.py, which skips only the launch arguments `out` and
     `workers`; the null rebuilt from run 1 with null_sha256; the episode count recomputed on
     run 1 equal to 100. Any FAIL is a stop for the owner; nothing launches. Nobody reads run
     1's report or the guard's output.log (the sweep prints every cell's contrast mean there)
     before the verdict; on a non-zero exit only lines matching Error or Traceback are read.
  3. The twin launch (kappa 0.2) under its own file and approval, first.
  4. This launch, test tier, after the twin has written its report (one guarded launch at a
     time), the owner has committed this file and created
     approvals/2026-11-27-claim-a-boundary-delta-2.ok:
     bash tools/rtx_guard.sh launch W -- .venv/Scripts/python experiments/sweep_phase_diagram.py
     --tier test --platform rtx-1 --prereg preregistrations/2026-11-27-claim-a-boundary-delta-2.yaml
     --delays 0 1 2 4 8 --lams 0.0 0.5 0.8 0.95 --sigmas 0.0 0.1 0.2 0.4 --class-sizes 2 2
     --horizon 40 --delta 0.1 --episodes 100 --workers W --backend local --out runs/phase
  5. Scoring, once both reports exist:
     .venv/Scripts/python experiments/claim_a_gate.py score runs/phase/<kappa report>.json
     runs/phase/<delta report>.json --prereg preregistrations/2026-11-27-claim-a-boundary-delta-2.yaml
     It matches the reports to the settings by their recorded instance, refuses anything
     that is not a complete, finite, test-tier report launched under the committed file
     naming its setting, writes runs/claim_a/2026-11-27-claim-a-boundary-delta-2/ and prints
     the verdict or NOT COMPLETED, the same verdict the kappa file's scoring prints. Then experiments/claim_a_descriptives.py on that folder
     and the two reports, with --dev-map, writes descriptives.json. No number from either
     enters a draft before the run-auditor and the adversarial-reviewer pass.
