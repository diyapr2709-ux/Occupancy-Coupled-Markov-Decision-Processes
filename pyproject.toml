[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocmdp"
version = "0.1.0"
description = "Occupancy-coupled Markov decision processes, applied to hospital antimicrobial stewardship"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "gymnasium>=0.29", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ocmdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
